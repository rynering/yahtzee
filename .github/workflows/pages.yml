name: Deploy Lucky Roll to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/engine.test.mjs
      - name: Install browser check tooling
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --package-lock=false playwright@1.62.1
      - name: Check phone and desktop layouts
        timeout-minutes: 5
        run: node scripts/browser-check.mjs
      - name: Save layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-screenshots
          path: artifacts/screenshots
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
